services:
  api:
    image: "${DOCKERHUB_IMAGE:-local/developer-portfolio}-api:${DEPLOY_IMAGE_TAG:-dev}"
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: "${DOCKERHUB_IMAGE:-local/developer-portfolio}-web:${DEPLOY_IMAGE_TAG:-dev}"
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/healthz"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
