name: Deploy portfolio to EC2

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or SHA to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: developer-portfolio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync and deploy on EC2
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          [[ -n "$EC2_HOST" ]] || {
            echo "Set repository variable EC2_HOST to your EC2 public DNS name or IPv4 address."
            exit 1
          }
          [[ -n "$EC2_USER" ]] || {
            echo "Set repository variable EC2_USER (or leave empty to use ubuntu)."
            exit 1
          }
          [[ -n "$EC2_SSH_PRIVATE_KEY" ]] || {
            echo "Set repository secret EC2_SSH_PRIVATE_KEY with a key allowed for the EC2 user."
            exit 1
          }

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Upload repository files to EC2
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2-deploy-key"
          known_hosts_file="$RUNNER_TEMP/ec2-known-hosts"
          app_dir="$EC2_APP_DIR"
          if [[ -z "$app_dir" ]]; then
            app_dir="/home/$EC2_USER/developer-portfolio"
          fi
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"

          ssh-keyscan -H "$EC2_HOST" > "$known_hosts_file"

          ssh \
            -F /dev/null \
            -i "$key_file" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$app_dir'"

          rsync \
            --archive \
            --delete \
            --compress \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'artifacts/**/dist/' \
            --exclude '*.log' \
            -e "ssh -F /dev/null -i '$key_file' -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$known_hosts_file'" \
            ./ "$EC2_USER@$EC2_HOST:$app_dir/"

      - name: Build and restart app with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2-deploy-key"
          known_hosts_file="$RUNNER_TEMP/ec2-known-hosts"
          app_dir="$EC2_APP_DIR"
          if [[ -z "$app_dir" ]]; then
            app_dir="/home/$EC2_USER/developer-portfolio"
          fi
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$key_file"
          ssh-keyscan -H "$EC2_HOST" > "$known_hosts_file"

          ssh \
            -F /dev/null \
            -i "$key_file" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$EC2_USER@$EC2_HOST" \
            "chmod +x '$app_dir/deploy/deploy.sh' && cd '$app_dir' && '$app_dir/deploy/deploy.sh' deploy && '$app_dir/deploy/deploy.sh' status"
