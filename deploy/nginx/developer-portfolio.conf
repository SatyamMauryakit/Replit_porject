# Replace your-domain.example with the real DNS name before requesting TLS.
# This host-level Nginx server stays running while Docker releases are swapped.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    client_max_body_size 5m;

    location / {
        include /etc/nginx/snippets/developer-portfolio-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
